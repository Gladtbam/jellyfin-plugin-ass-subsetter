name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'manifest.json'
      - 'build.yaml'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'manifest.json'
      - 'build.yaml'
  workflow_dispatch:

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
