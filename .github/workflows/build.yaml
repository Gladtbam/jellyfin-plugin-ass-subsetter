name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'manifest.json'
      - 'build.yaml'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'manifest.json'
      - 'build.yaml'
  workflow_dispatch:

jobs:
  call:
    if: github.event_name != 'pull_request' || github.actor != 'Gladtbam'
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
